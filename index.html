<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shahzer Najeeb — Full-Stack Software Engineer</title>
    <meta
      name="description"
      content="Shahzer Najeeb — Full-stack software engineer. Backend architecture, distributed systems, real-time interfaces."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Preload critical front-facing moon segments -->
    <link
      rel="preload"
      fetchpriority="high"
      as="image"
      href="/moon/4k/00.jpg"
    />
    <link
      rel="preload"
      fetchpriority="high"
      as="image"
      href="/moon/4k/01.jpg"
    />
  </head>
  <svg height="0" width="0">
    <filter id="glass">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.01 0.01"
        numOctaves="5"
        result="noise"
      />
      <feDisplacementMap
        in2="noise"
        in="SourceGraphic"
        scale="10"
        xChannelSelector="R"
        yChannelSelector="G"
      />
    </filter>
  </svg>
  <body>
    <div id="app"></div>
    <script>
      history.scrollRestoration = "manual";

      if (location.hash) {
        history.replaceState(null, "", location.pathname + location.search);
      }

      window.scrollTo(0, 0);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
